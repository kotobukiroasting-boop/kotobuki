<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans+JP:wght@200;300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:'Noto Sans JP',sans-serif;font-weight:300}

/* ── NAV BAR ── */
.nav{
  background:rgba(7,6,4,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid #3a3422;
  display:flex;align-items:center;
  padding:0 20px;
  height:52px;
  position:relative;
}

/* ロゴ */
.nav-logo{
  display:flex;align-items:center;gap:10px;
  text-decoration:none;flex-shrink:0;
  margin-right:auto;
}
.nav-logo-mark{
  width:28px;height:28px;border:1px solid #d4a040;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:.6rem;color:#d4a040;
  flex-shrink:0;
}
.nav-logo-text{
  font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.22em;
  color:#d4a040;white-space:nowrap;
}

/* ハンバーガーボタン（常に表示） */
.nav-toggle{
  background:none;border:1px solid #3a3422;
  width:36px;height:36px;cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  flex-shrink:0;transition:border-color .2s;
}
.nav-toggle:hover{border-color:#d4a040}
.nav-toggle span{
  display:block;width:16px;height:1px;
  background:#b09878;transition:background .2s;
}
.nav-toggle:hover span{background:#d4a040}

/* ドロップダウンメニュー */
.nav-menu{
  position:absolute;top:52px;right:0;
  background:rgba(7,6,4,.98);
  border:1px solid #3a3422;border-top:none;
  min-width:220px;
  opacity:0;pointer-events:none;
  transform:translateY(-8px);
  transition:opacity .25s cubic-bezier(.16,1,.3,1),transform .25s cubic-bezier(.16,1,.3,1);
  z-index:999;
}
.nav-menu.open{
  opacity:1;pointer-events:all;transform:translateY(0);
}

/* メニューヘッダー */
.menu-header{
  padding:12px 18px 10px;
  border-bottom:1px solid #3a3422;
}
.menu-header-label{
  font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.4em;
  color:#6a5a42;text-transform:uppercase;
}

/* メニューアイテム */
.menu-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 18px;text-decoration:none;
  border-bottom:1px solid #1e1c14;
  transition:background .15s;
  cursor:pointer;
  position:relative;
}
.menu-item:last-child{border-bottom:none}
.menu-item:hover{background:#1e1c14}
.menu-item:hover .menu-arrow{opacity:1;transform:translateX(0)}

.menu-icon{
  font-size:1rem;line-height:1;
  width:22px;text-align:center;flex-shrink:0;
}
.menu-text{flex:1}
.menu-name{
  font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.15em;
  color:#f8f2e4;text-transform:uppercase;display:block;margin-bottom:2px;
}
.menu-desc{
  font-size:.58rem;letter-spacing:.05em;color:#6a5a42;display:block;
}
.menu-arrow{
  font-size:.6rem;color:#d4a040;opacity:0;
  transform:translateX(-4px);transition:opacity .15s,transform .15s;
}

/* 現在のページ */
.menu-item.current{background:#111009}
.menu-item.current .menu-name{color:#d4a040}
.menu-item.current::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:2px;background:#d4a040;
}

/* オーバーレイ */
.nav-overlay{
  position:fixed;inset:0;z-index:998;
  display:none;
}
.nav-overlay.open{display:block}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <!-- ロゴ -->
  <a class="nav-logo" href="https://kotobukiroasting-boop.github.io/kotobuki/" target="_top">
    <span class="nav-logo-mark">K</span>
    <span class="nav-logo-text">KOTOBUKI ROASTERS</span>
  </a>

  <!-- ハンバーガー -->
  <button class="nav-toggle" id="navToggle" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>

  <!-- ドロップダウン -->
  <div class="nav-menu" id="navMenu">
    <div class="menu-header">
      <span class="menu-header-label">Navigation</span>
    </div>

    <a class="menu-item" href="https://kotobukiroasting-boop.github.io/kotobuki/kotobuki_flavor_guide.html" target="_top">
      <span class="menu-icon">☕</span>
      <span class="menu-text">
        <span class="menu-name">Flavor Catalog</span>
        <span class="menu-desc">コーヒー豆の検索・フィルター</span>
      </span>
      <span class="menu-arrow">→</span>
    </a>

    <a class="menu-item" href="https://recipe-brewgide.netlify.app" target="_top">
      <span class="menu-icon">📖</span>
      <span class="menu-text">
        <span class="menu-name">Recipe Guide</span>
        <span class="menu-desc">抽出レシピ・ドリッパーガイド</span>
      </span>
      <span class="menu-arrow">→</span>
    </a>

    <a class="menu-item" href="https://kotobukiroasting-boop.github.io/kotobuki/kotobuki_coffee_note_firebase.html" target="_top">
      <span class="menu-icon">📝</span>
      <span class="menu-text">
        <span class="menu-name">Coffee Note</span>
        <span class="menu-desc">コーヒーノートを記録する</span>
      </span>
      <span class="menu-arrow">→</span>
    </a>

    <a class="menu-item" href="https://kotobukiroasting-boop.github.io/kotobuki/chat.html" target="_top">
      <span class="menu-icon">💬</span>
      <span class="menu-text">
        <span class="menu-name">Chat</span>
        <span class="menu-desc">スタッフへのお問い合わせ</span>
      </span>
      <span class="menu-arrow">→</span>
    </a>

    <a class="menu-item" href="https://www.kotobukidiet.com/shop" target="_top">
      <span class="menu-icon">🛒</span>
      <span class="menu-text">
        <span class="menu-name">Online Shop</span>
        <span class="menu-desc">コーヒー豆を購入する</span>
      </span>
      <span class="menu-arrow">→</span>
    </a>
  </div>
</nav>

<!-- オーバーレイ（メニュー外クリックで閉じる） -->
<div class="nav-overlay" id="navOverlay" onclick="closeMenu()"></div>

<script>
function toggleMenu(){
  const menu = document.getElementById('navMenu');
  const overlay = document.getElementById('navOverlay');
  const isOpen = menu.classList.contains('open');
  if(isOpen){ closeMenu(); } else { openMenu(); }
}
function openMenu(){
  document.getElementById('navMenu').classList.add('open');
  document.getElementById('navOverlay').classList.add('open');
}
function closeMenu(){
  document.getElementById('navMenu').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('open');
}

// 現在のページをハイライト
(function(){
  const currentUrl = window.location.href;
  const items = document.querySelectorAll('.menu-item');
  items.forEach(item => {
    const href = item.getAttribute('href');
    if(href && currentUrl.includes(href.split('/').pop().split('.')[0])){
      item.classList.add('current');
    }
  });
})();

// 高さ通知（Wix用）
function notifyHeight(){
  window.parent.postMessage({type:'height', value: document.body.scrollHeight}, '*');
}
window.addEventListener('load', notifyHeight);
window.addEventListener('resize', notifyHeight);
document.getElementById('navMenu').addEventListener('transitionend', notifyHeight);
</script>
</body>
</html>
